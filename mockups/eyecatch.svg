<svg width="1280" height="670" viewBox="0 0 1280 670" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4ec"/>
      <stop offset="100%" stop-color="#ffe4d1"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#e14f2a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#7a3a1a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="670" fill="url(#bg)"/>

  <!-- decorative circles -->
  <circle cx="1120" cy="120" r="130" fill="#ffd9bd" opacity="0.6"/>
  <circle cx="100" cy="560" r="170" fill="#ffd9bd" opacity="0.5"/>

  <!-- bell icon -->
  <g filter="url(#soft)">
    <circle cx="220" cy="335" r="130" fill="url(#bell)"/>
  </g>
  <path d="M220 260 a55 55 0 0 1 55 55 v40 l20 30 h-150 l20 -30 v-40 a55 55 0 0 1 55 -55 z"
        fill="#fff" opacity="0.95"/>
  <circle cx="220" cy="405" r="14" fill="#fff" opacity="0.95"/>

  <!-- Slack badge -->
  <circle cx="330" cy="240" r="34" fill="#ffffff"/>
  <text x="330" y="252" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="30" text-anchor="middle">💬</text>

  <!-- Title -->
  <text x="430" y="255" font-family="Yu Gothic UI, Segoe UI, Hiragino Sans, sans-serif" font-size="44" font-weight="800" fill="#3a2418">Claude Codeの</text>
  <text x="430" y="315" font-family="Yu Gothic UI, Segoe UI, Hiragino Sans, sans-serif" font-size="44" font-weight="800" fill="#3a2418">トークン回復を</text>
  <text x="430" y="375" font-family="Yu Gothic UI, Segoe UI, Hiragino Sans, sans-serif" font-size="44" font-weight="800" fill="#e14f2a">Slackで通知</text>
  <text x="430" y="435" font-family="Yu Gothic UI, Segoe UI, Hiragino Sans, sans-serif" font-size="44" font-weight="800" fill="#3a2418">させてみた</text>

  <text x="432" y="480" font-family="Yu Gothic UI, Segoe UI, Hiragino Sans, sans-serif" font-size="20" fill="#6b5142">非ITエンジニアのAI活用日記</text>
</svg>
