<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="winShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1b2030" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="#eef0f2"/>

  <g filter="url(#winShadow3)">
    <rect x="40" y="30" width="920" height="500" rx="10" fill="#ffffff"/>
  </g>

  <!-- Slack logo mark (simplified) -->
  <g transform="translate(72,58)">
    <rect x="0" y="6" width="6" height="16" rx="3" fill="#36c5f0"/>
    <rect x="8" y="0" width="16" height="6" rx="3" fill="#2eb67d"/>
    <rect x="26" y="8" width="6" height="16" rx="3" fill="#ecb22e"/>
    <rect x="8" y="26" width="16" height="6" rx="3" fill="#e01e5a"/>
  </g>
  <text x="112" y="76" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#1d1c1d">slack</text>

  <text x="72" y="130" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="24" font-weight="800" fill="#1d1c1d">Slack へのアクセスを「Token</text>
  <text x="72" y="160" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="24" font-weight="800" fill="#1d1c1d">Recovery Notifier」アプリに許可する</text>

  <text x="72" y="196" font-family="Yu Gothic UI, sans-serif" font-size="13" fill="#616061">このアプリは、参加中のワークスペース Claude-</text>
  <text x="72" y="216" font-family="Yu Gothic UI, sans-serif" font-size="13" fill="#616061">Company のメンバーにより作成されました。</text>

  <text x="72" y="260" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d1c1d">Workspace</text>
  <rect x="72" y="270" width="308" height="40" rx="6" fill="#ffffff" stroke="#8a8d91"/>
  <rect x="80" y="278" width="18" height="18" rx="3" fill="#ecb22e"/>
  <text x="106" y="295" font-family="Segoe UI, sans-serif" font-size="14" fill="#1d1c1d">Claude-Company</text>
  <text x="360" y="295" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a8d91">▾</text>

  <text x="72" y="340" font-family="Yu Gothic UI, sans-serif" font-size="13" font-weight="700" fill="#1d1c1d">Webhook 用のチャンネル</text>
  <rect x="72" y="350" width="308" height="40" rx="6" fill="#ffffff" stroke="#1264a3" stroke-width="2"/>
  <text x="86" y="375" font-family="Segoe UI, sans-serif" font-size="14" fill="#1d1c1d"># claude-code-alert</text>
  <text x="360" y="375" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a8d91">▾</text>

  <text x="72" y="410" font-family="Yu Gothic UI, sans-serif" font-size="12" fill="#8a8d91">"Token Recovery Notifier" がアプリとして投稿すること</text>
  <text x="72" y="428" font-family="Yu Gothic UI, sans-serif" font-size="12" fill="#8a8d91">のできるチャンネルを指定する必要があります。</text>

  <!-- right panel -->
  <text x="560" y="130" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1d1c1d">Review app permissions</text>
  <rect x="560" y="150" width="360" height="40" rx="6" fill="#f8f8fa" stroke="#e4e4e6"/>

  <text x="560" y="212" font-family="Yu Gothic UI, sans-serif" font-size="12" fill="#616061">Slack はあなたに付与されている権限を Token</text>
  <text x="560" y="230" font-family="Yu Gothic UI, sans-serif" font-size="12" fill="#616061">Recovery Notifier と共有します。インストールする</text>
  <text x="560" y="248" font-family="Yu Gothic UI, sans-serif" font-size="12" fill="#616061">前に規約をご確認ください。</text>

  <rect x="700" y="440" width="90" height="40" rx="6" fill="#ffffff" stroke="#8a8d91"/>
  <text x="745" y="465" font-family="Yu Gothic UI, sans-serif" font-size="13" text-anchor="middle" fill="#1d1c1d">キャンセル</text>

  <rect x="800" y="440" width="100" height="40" rx="6" fill="#2eb67d"/>
  <text x="850" y="465" font-family="Yu Gothic UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">許可する</text>
</svg>
