<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1b2030" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="#eef0f2"/>

  <g filter="url(#winShadow)">
    <rect x="40" y="30" width="920" height="460" rx="10" fill="#ffffff"/>
  </g>

  <!-- browser chrome -->
  <rect x="40" y="30" width="920" height="44" rx="10" fill="#f4f4f6"/>
  <rect x="40" y="60" width="920" height="14" fill="#f4f4f6"/>
  <circle cx="66" cy="52" r="6" fill="#ff5f57"/>
  <circle cx="86" cy="52" r="6" fill="#febc2e"/>
  <circle cx="106" cy="52" r="6" fill="#28c840"/>
  <rect x="140" y="42" width="420" height="20" rx="6" fill="#ffffff" stroke="#dcdfe3"/>
  <text x="152" y="57" font-family="Segoe UI, sans-serif" font-size="12" fill="#6b7280">api.slack.com/apps/A0XXXXX/incoming-webhooks</text>

  <!-- left sidebar -->
  <rect x="40" y="74" width="220" height="416" fill="#f8f8fa"/>
  <circle cx="80" cy="110" r="18" fill="#4a154b"/>
  <text x="80" y="116" font-family="Segoe UI, sans-serif" font-size="16" text-anchor="middle" fill="white">T</text>
  <text x="108" y="115" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1d1c1d">Token Recovery Notifier</text>

  <text x="64" y="156" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a8d91">Settings</text>
  <text x="64" y="182" font-family="Segoe UI, sans-serif" font-size="13" fill="#454245">Basic Information</text>
  <text x="64" y="206" font-family="Segoe UI, sans-serif" font-size="13" fill="#454245">Collaborators</text>
  <text x="64" y="230" font-family="Segoe UI, sans-serif" font-size="13" fill="#454245">Install App</text>
  <text x="64" y="258" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a8d91">Features</text>
  <text x="64" y="282" font-family="Segoe UI, sans-serif" font-size="13" fill="#454245">App Home</text>
  <rect x="52" y="292" width="196" height="30" rx="6" fill="#ecebff"/>
  <text x="64" y="312" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#4a154b">Incoming Webhooks</text>
  <text x="64" y="340" font-family="Segoe UI, sans-serif" font-size="13" fill="#454245">Slash Commands</text>
  <text x="64" y="368" font-family="Segoe UI, sans-serif" font-size="13" fill="#454245">OAuth &amp; Permissions</text>

  <!-- main content -->
  <text x="292" y="118" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#1d1c1d">Incoming Webhooks</text>
  <text x="292" y="146" font-family="Segoe UI, sans-serif" font-size="13" fill="#616061">Incoming webhooks are a simple way to post messages from external sources into Slack.</text>

  <!-- toggle row -->
  <rect x="292" y="176" width="620" height="60" rx="8" fill="#f8f8fa" stroke="#e4e4e6"/>
  <text x="312" y="212" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d1c1d">Activate Incoming Webhooks</text>

  <!-- toggle switch ON -->
  <rect x="850" y="192" width="46" height="24" rx="12" fill="#2eb67d"/>
  <circle cx="884" cy="204" r="10" fill="#ffffff"/>
  <text x="822" y="208" font-family="Segoe UI, sans-serif" font-size="12" fill="#2eb67d" text-anchor="end">On</text>

  <text x="292" y="272" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#1d1c1d">Webhook URLs for Your Workspace</text>
  <text x="292" y="296" font-family="Segoe UI, sans-serif" font-size="12" fill="#616061">Add this webhook to your workspace below.</text>

  <!-- Add webhook button (実際の表記に合わせる) -->
  <rect x="292" y="316" width="180" height="42" rx="6" fill="#ffffff" stroke="#1d1c1d" stroke-width="1.5"/>
  <text x="382" y="342" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1c1d">Add New Webhook</text>
</svg>
