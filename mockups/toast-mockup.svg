<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe6f0"/>
      <stop offset="100%" stop-color="#c9d3e3"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b7bff"/>
      <stop offset="100%" stop-color="#1a3fb0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1b2030" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bgGrad)"/>

  <!-- taskbar hint at bottom -->
  <rect x="0" y="440" width="900" height="40" fill="#1f2430" opacity="0.85"/>
  <circle cx="30" cy="460" r="10" fill="#4a90ff"/>
  <circle cx="60" cy="460" r="10" fill="#7d7d7d"/>
  <circle cx="90" cy="460" r="10" fill="#7d7d7d"/>

  <!-- toast card -->
  <g filter="url(#shadow)">
    <rect x="430" y="80" width="430" height="150" rx="12" fill="#f6f7f9" stroke="#d9dce1" stroke-width="1.5"/>
  </g>

  <!-- app icon -->
  <rect x="454" y="104" width="46" height="46" rx="10" fill="url(#iconGrad)"/>
  <text x="477" y="135" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="22" text-anchor="middle" fill="white">⏰</text>

  <!-- text content -->
  <text x="516" y="112" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="15" fill="#5b6270">Token Recovery Notifier</text>
  <text x="516" y="140" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="19" font-weight="700" fill="#1b1e24">Claude Codeの利用上限が</text>
  <text x="516" y="163" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="19" font-weight="700" fill="#1b1e24">リセットされました</text>
  <text x="516" y="192" font-family="Segoe UI, Yu Gothic UI, sans-serif" font-size="16" fill="#3a3f4b">作業を再開できます。</text>

  <text x="838" y="106" font-family="Segoe UI, sans-serif" font-size="16" fill="#8a90a0">✕</text>
</svg>
